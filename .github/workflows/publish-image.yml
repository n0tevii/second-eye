name: Publish tested NAS image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing fixed release tag (for example v0.2.4)
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: nas-image-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'n0tevii/second-eye'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
      REGISTRY_IMAGE: ghcr.io/n0tevii/second-eye
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > /tmp/release.json
          python -c 'import json; r=json.load(open("/tmp/release.json")); assert not r["isDraft"] and not r["isPrerelease"]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.VERSION }}
          path: release-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Pin actual base and record source
        run: |
          echo "SOURCE_SHA=$(git -C release-source rev-parse HEAD)" >> "$GITHUB_ENV"
          BASE=$(awk 'NR==1 && $1=="FROM" {print $2}' release-source/Dockerfile)
          test -n "$BASE"
          docker pull --platform linux/amd64 "$BASE"
          BASE_DIGEST=$(docker image inspect "$BASE" --format '{{index .RepoDigests 0}}')
          export BASE_DIGEST
          python scripts/prepare_image_build.py
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: release-source
          file: image-output/Dockerfile.pinned
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}
          build-args: APP_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/n0tevii/second-eye
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=nas-amd64
          cache-to: type=gha,mode=max,scope=nas-amd64
      - name: Linux regression and runtime smoke tests
        run: bash scripts/test_image.sh "$REGISTRY_IMAGE:$VERSION" "$VERSION"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="$REGISTRY_IMAGE:$VERSION"
          if gh api --paginate /users/n0tevii/packages/container/second-eye/versions --jq '.[].metadata.container.tags[]' > /tmp/package-tags 2>/tmp/package-error; then
            if grep -Fxq "$VERSION" /tmp/package-tags; then
              echo 'Refusing to overwrite an existing version tag'; exit 1
            fi
          else
            grep -q 'HTTP 404' /tmp/package-error || { cat /tmp/package-error; exit 1; }
          fi
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > image-output/image-reference.txt
          python scripts/prepare_image_build.py --published
          gh release upload "$VERSION" image-output/image-manifest.json image-output/image-reference.txt image-output/Dockerfile.pinned --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nas-image-${{ env.VERSION }}
          path: image-output/
          if-no-files-found: ignore
