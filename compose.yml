services:
  second-eye:
    build:
      context: .
      args:
        HTTP_PROXY: ${PROXY:-}
        HTTPS_PROXY: ${PROXY:-}
        APP_VERSION: ${SECOND_EYE_VERSION:?请设置固定版本}
    image: second-eye:${SECOND_EYE_VERSION:?请设置固定版本}
    container_name: second-eye
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"
      - "127.0.0.1:${NOVNC_PORT:-16080}:6080"
    environment:
      DATABASE_URL: sqlite:////app/data/goodprice.db
      PROXY: ${PROXY:-}
      TZ: Asia/Shanghai
      ENABLE_NOVNC: ${ENABLE_NOVNC:-0}
    volumes:
      - ./data:/app/data
    shm_size: "512mb"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
